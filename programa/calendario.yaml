# Calendario anual del curso "Español desde el ruso".
#
# Fuente de verdad para cualquier cuenta de días, semanas, unidades y temas.
# Lo leen scripts/plan.py (modelo), scripts/validar.py (comprobaciones),
# scripts/construir_sitio.py (calendario en HTML) y scripts/escribir_leccion.py
# (el generador, que toma de aquí el tema del día).
#
# Formato de cada día (secuencia compacta):
#   [semana, dia, tipo, tema_es, tema_ru, foco, salida]
#   - tipo: leccion | repaso | cultura | prueba | simulacro | proyecto | examen | reserva
#   - foco: lo nuevo del día (gramática, léxico, fonética o destreza)
#   - salida: lo que el alumno PRODUCE al final de los 30 minutos
#
# Semana tipo: lunes-viernes lección nueva; sábado repaso (en la 2.ª semana de
# cada unidad, prueba de unidad); domingo cultura (sesión ligera + repaso SRS).

meta:
  titulo: "Español desde el ruso · Испанский с нуля для русскоговорящих"
  version: "0.1"
  minutos_por_dia: 30
  dias: 365
  semanas: 52
  nivel_de_salida: "A2 (MCER), preparado para el DELE A2"
  horas_totales: 182.5
  fases:
    - {nombre: "A1", semanas: [1, 22], unidades: [1, 11], horas: 77}
    - {nombre: "A2", semanas: [23, 48], unidades: [12, 24], horas: 91}
    - {nombre: "Final", semanas: [49, 52], unidades: [], horas: 14}
  semana_tipo:
    1: leccion
    2: leccion
    3: leccion
    4: leccion
    5: leccion
    6: repaso
    7: cultura
  palabras_nuevas_por_leccion: [6, 10]
  vocabulario_objetivo:
    A1: 900
    A2: 1900

unidades:

  - numero: 1
    nivel: A1
    semanas: [1, 2]
    titulo_es: "¡Hola! Sonidos y saludos"
    titulo_ru: "¡Hola! Звуки и приветствия"
    objetivos:
      - "Leer en voz alta cualquier palabra española con la pronunciación y el acento correctos."
      - "Saludar, despedirse y presentarse (nombre, origen, edad) en tú y en usted."
      - "Contar de 0 a 20 y deletrear el propio nombre."
    funciones: ["saludar y despedirse", "presentarse y presentar a alguien", "preguntar y decir el nombre, el origen y la edad", "pedir repetición y aclaración"]
    gramatica: ["alfabeto y correspondencia letra-sonido", "sílaba tónica y tilde", "ser (singular y plural)", "llamarse", "tener (edad)", "tú / usted", "interrogativos qué, quién, cómo, dónde, de dónde", "género de los gentilicios"]
    lexico: ["saludos y despedidas", "países y nacionalidades", "números 0-20", "lenguaje del aula"]
    fonetica: ["cinco vocales sin reducción", "b = v", "h muda", "c/z/qu, g/j, ñ, ll/y, r/rr, ch, x", "d y t dentales", "entonación de pregunta"]
    contraste_ru: ["sin reducción vocálica (аканье)", "б/в son un solo sonido", "ты/вы = tú/usted, pero usted lleva verbo en 3.ª persona", "sin patronímico; dos apellidos", "¿? y ¡! al principio"]
    cultura: ["dónde se habla español", "saludos con beso y apretón de manos", "nombres y apellidos hispanos"]
    tarea_final: "Grabar una presentación de 30 segundos (nombre, origen, edad, idiomas) y escribirla."
    episodio: {titulo: "Un portal, dos nombres", sinopsis: "Iván aterriza y solo puede decir su nombre. Ana le abre el portal."}
