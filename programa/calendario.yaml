      - [1, 1, leccion, "El alfabeto y las cinco vocales", "Алфавит и пять гласных", "Nombres de las letras; a-e-i-o-u siempre claras (sin reducción); ¡Hola! / Adiós", "Leer 20 palabras transparentes en voz alta y grabarse"]
      - [1, 2, leccion, "Consonantes fáciles y los saludos del día", "Простые согласные и приветствия по времени суток", "p, t, k, m, n, l, s, f; d/t dentales; b = v; h muda; buenos días / tardes / noches; ¿Qué tal?", "Mini-diálogo de saludo de 4 réplicas"]
      - [1, 3, leccion, "Las letras difíciles: c, z, qu, g, j, ñ, ll, y, r, rr, ch, x", "Трудные буквы: c, z, qu, g, j, ñ, ll, y, r, rr, ch, x", "Reglas de lectura; ¿Cómo te llamas? Me llamo…; ¿y tú?", "Leer y clasificar 24 palabras por sonido"]
      - [1, 4, leccion, "El acento: sílaba tónica y tilde", "Ударение: ударный слог и знак тильды", "Agudas, llanas, esdrújulas; cuándo se escribe la tilde; Soy… / Me llamo…; ¿Cómo se escribe?", "Marcar la sílaba tónica en 20 palabras y deletrear el propio nombre"]
      - [1, 5, leccion, "Números 0-10 y tú / usted", "Числа 0-10 и ты / Вы", "cero-diez; tú vs usted (ты/Вы) y su verbo; ¿Cómo se llama usted?; hasta luego / hasta mañana", "Diálogo formal e informal de presentación"]
      - [1, 6, repaso, "Repaso de la semana 1: sonidos y saludos", "Повторение недели 1: звуки и приветствия", "Dictado de sonidos; lectura cronometrada; mini-test de 10 ítems", "Autoevaluación de la semana con la lista de control"]
