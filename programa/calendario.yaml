      - [4, 7, cultura, "El euro, el peso y los objetos de cada día", "Евро, песо и предметы быта", "Monedas del mundo hispano; marcas conocidas; tarea final «Mi mochila»", "Entregar «Mi mochila» (foto + 6 frases)"]

