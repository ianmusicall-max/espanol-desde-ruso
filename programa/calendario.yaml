      - [2, 5, leccion, "Lenguaje del aula y de supervivencia", "Язык урока и язык выживания", "¿Cómo se dice … en español?; No entiendo; Más despacio, por favor; Perdón / Lo siento; Gracias / De nada; diálogo completo de presentación", "Diálogo de presentación de 8 réplicas, grabado"]
