      - [2, 1, leccion, "Ser y las nacionalidades", "Глагол ser и национальности", "soy / eres / es; ¿De dónde eres? Soy de Rusia, soy ruso / rusa; género de los gentilicios -o/-a, -és/-esa", "Presentar a tres personas famosas: nombre, origen, nacionalidad"]
      - [2, 2, leccion, "Somos, sois, son: el plural", "Мы, вы, они: множественное число", "somos / sois / son; plural de los gentilicios -s / -es; ¿Eres ruso? Sí / No, soy…; ¿Hablas español? Un poco", "Rellenar una tabla de 6 personas y presentarlas en plural"]
      - [2, 3, leccion, "Números 11-20 y la edad", "Числа 11-20 и возраст", "once-veinte; ¿Cuántos años tienes? Tengo … años (fórmula); tiene … años", "Preguntar y decir la edad de 5 personas"]
