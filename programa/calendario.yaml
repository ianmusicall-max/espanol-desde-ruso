      - [3, 3, leccion, "El / la frente a un / una", "El / la или un / una: определённый и неопределённый", "Primera mención (un) frente a cosa conocida (el); en la mesa hay un libro; el libro es de Ana", "Completar un texto de 12 huecos con el artículo correcto"]
