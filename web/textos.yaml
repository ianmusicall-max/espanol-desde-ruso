es:
  menu: {inicio: "Inicio", curso: "Las lecciones", sobre: "El curso", contacto: "Contacto"}
  titulo_sitio: "Español desde el ruso"
  portada:
    titulo: "Español desde cero"
    titulo2: "para rusohablantes"
    lema: "30 minutos al día: en un año, de cero a A2"
    entrada: "Curso gratuito de 365 lecciones de 30 minutos, del alfabeto al nivel A2 y al examen DELE. Sin registro, sin pago, en el navegador. Las lecciones están escritas en ruso, que es la lengua del alumno."
    marco: "El programa sigue los niveles A1–A2 y prepara para el DELE A2, el examen oficial del Instituto Cervantes."
    boton: "Ver la primera lección"
    boton2: "Ver el programa"
    ya_sabe: "¿Ya sabe algo de español?"
    ya_sabe_enlace: "Haga el test y empiece por la lección que le toca"
