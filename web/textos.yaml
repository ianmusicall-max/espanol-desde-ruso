  sobre:
    titulo: "О курсе"
    quien: "Кто это написал"
    porque: "Почему «с русского», а не просто «испанский»"
    porque_texto: "Курсы испанского пишут для всех сразу. Но ошибки у всех разные. Русскоговорящий пропускает артикль не потому, что невнимателен, а потому что в его языке этой категории нет вообще. Он ставит прилагательное перед существительным, потому что так устроен русский. Он говорит «мне тридцать» вместо <em>tengo treinta años</em>, потому что в русском возраст — в дательном падеже."
    porque_texto2: "Курс построен вокруг этих двадцати типичных ошибок. Они перечислены заранее, разбираются по одной и возвращаются в ключах к упражнениям и в вариантах ответов тестов: неправильный вариант — это всегда то, что сказал бы русскоговорящий."
    como: "Как заниматься"
    como_texto: "Один урок в день, по порядку, 30 минут. Не больше: курс рассчитан на год, и пропущенная неделя вредит меньше, чем три урока подряд за один вечер. В конце каждого урока есть «Выход» — то, что нужно написать или записать вслух. Без этого урок не считается сделанным."
    cuanto: "Сколько это стоит"
    cuanto_texto: "Нисколько. Курс открыт целиком, без регистрации. Сайт существует за счёт рекламы."
    abierto: "Сейчас открыто"
    falta: "Что нужно для занятий"
    falta_texto: "Покупать ничего не надо: курс, озвучка, картинки и карточки — бесплатно и без регистрации. Но три вещи понадобятся с первого дня, и лучше знать об этом заранее."
    falta_lista:
      - "<strong>Тетрадь и ручка.</strong> Больше половины уроков просят что-то написать от руки. Это не прихоть: рука запоминает написание лучше клавиатуры, а ударения и ñ на телефоне набирать неудобно."
      - "<strong>Телефон с диктофоном.</strong> Каждый пятый урок просит записать себя и послушать. Изнутри свой акцент не слышно — это единственный способ его заметить. Подойдёт тот диктофон, который уже есть в телефоне."
      - "<strong>Карточки для слов.</strong> С них начинается почти каждый урок. Делать их самому не нужно: колода уже готова — 3001 слово с озвучкой и картинками, скачать можно на странице со списком уроков. Бумажные тоже подойдут, если так привычнее."
    falta_no: "Что НЕ нужно: учебник — курс полный сам по себе; словарь — все слова переведены в самом уроке; принтер. В наушниках испанские звуки слышно лучше, но обойтись можно и без них."
    dele: "Зачем это нужно: экзамен DELE A2"
    dele_texto: "Курс ведёт к DELE A2 — это официальный диплом по испанскому языку. Его выдаёт Институт Сервантеса от имени Министерства образования Испании."
    dele_lista:
      - "<strong>Действует бессрочно.</strong> Сдали один раз — продлевать и подтверждать не нужно."
      - "<strong>Признаётся во всём мире:</strong> это государственный диплом Испании, а не сертификат языковой школы."
      - "<strong>Нужен для испанского гражданства.</strong> Тем, чей родной язык не испанский, DELE A2 нужен при подаче на гражданство по месту жительства. Граждане двадцати испаноязычных стран от него освобождены — к русскоговорящим это как раз не относится."
      - "<strong>Подтверждает понятный уровень:</strong> вы понимаете повседневную речь о себе, семье, покупках, работе и дороге и можете объясниться в простых ситуациях."
    dele_examen: "Экзамен состоит из четырёх частей: чтение (60 минут), аудирование (40), письмо (45) и устная часть (12 минут плюс 12 на подготовку). Считают по двум группам, и в каждой нужно набрать 60 %: чтение с письмом в одной, аудирование с устной частью в другой. Поэтому одной грамматики не хватит — последние четыре недели курса это пробные экзамены целиком."
    dele_aviso: "Даты, цена и места сдачи меняются каждый год, поэтому их здесь нет: смотрите на examenes.cervantes.es. Курс готовит к экзамену, но не записывает на него и ничего не гарантирует."
