en:
  menu: {inicio: "Home", curso: "Lessons", sobre: "About", contacto: "Contact"}
  titulo_sitio: "Spanish from Russian"
  portada:
    titulo: "Spanish from scratch"
    titulo2: "for Russian speakers"
    lema: "30 minutes a day: zero to A2 in a year"
    entrada: "A free course of 365 thirty-minute lessons, from the alphabet to level A2 and the DELE exam. No sign-up, no payment, in the browser. The lessons are written in Russian, the learner's language."
    marco: "The programme follows CEFR levels A1–A2 and prepares for the DELE A2, the official exam of the Instituto Cervantes."
    boton: "See the first lesson"
    boton2: "See the syllabus"
    ya_sabe: "Already know some Spanish?"
    ya_sabe_enlace: "Take the test — it tells you which lesson to start from"
    progreso: "lessons published"
    progreso_nota: "that is over {n} {meses} of daily study — plenty to start with"
    meses: ["months", "months"]
    dif_titulo: "What makes it different"
    dif_texto: "An ordinary textbook explains the Spanish rule. This one also explains <strong>where the learner's own language betrays them</strong>. Every lesson has a section, «Contrast with Russian», that names the mistake before it happens:"
    dif_error: "You will want to say:"
    dif_bien: "Correct:"
    dif_nota: "Russian has no article at all. So the learner does not «forget» it: they cannot hear that anything is missing. For the first three months the article comes back in the answer key of every exercise."
    dif_ayuda: "And the other way round: where Russian <em>helps</em>, the course says so plainly. <em>Me gusta el café</em> is literally «мне нравится кофе», the same structure. Reflexives are the Russian <em>-ся</em>. The past tenses are taught on the aspect the learner already has."
    dia_titulo: "What a session looks like"
    dia_min: "Minutes"
    dia_que: "What happens"
    dia_filas:
      - ["0–3", "Warm-up: yesterday's flashcards"]
      - ["3–6", "Pronunciation or listening"]
      - ["6–16", "The new point: example, rule and contrast with Russian"]
      - ["16–26", "Three exercises with answer keys"]
      - ["26–29", "Output: the learner writes or records something"]
      - ["29–30", "Wrap-up and new flashcards"]
    dia_nota: "Thirty minutes exactly. Not 45, not «however long it takes»: a day that does not fit in half an hour is split into two days."
    ano_titulo: "What you get"
    ano_tarjetas:
      - ["After 2 weeks", "Reads any Spanish word aloud, greets people, introduces themselves, counts to twenty."]
      - ["After 3 months", "Talks about family, home and daily routine, orders food, buys clothes."]
      - ["After 6 months · A1", "Travels, goes to the doctor, gives advice. Would pass an A1 exam."]
      - ["After a year · A2", "Talks about past and future, gives opinions, writes emails. Ready for the <strong>DELE A2</strong>."]
