    progreso_nota: "son más de {n} {meses} de estudio diario: hay de sobra para empezar"
    meses: ["meses", "meses"]
    dif_titulo: "Qué lo hace distinto"
    dif_texto: "Un manual corriente explica la regla española. Este explica además <strong>dónde le traiciona su propia lengua</strong> al alumno. Cada lección lleva un apartado, «Contraste con el ruso», que nombra el error antes de que ocurra:"
    dif_error: "Vas a querer decir:"
    dif_bien: "Correcto:"
    dif_nota: "El ruso no tiene artículo. Por eso el alumno no lo «olvida»: no percibe que falte algo. Los tres primeros meses del curso el artículo vuelve en la clave de cada ejercicio."
    dif_ayuda: "Y al revés: donde el ruso <em>ayuda</em>, el curso lo dice con todas las letras. <em>Me gusta el café</em> es literalmente «мне нравится кофе», la misma estructura. Los reflexivos son el <em>-ся</em> ruso. Los pasados se enseñan sobre el aspecto que el alumno ya tiene."
    dia_titulo: "Cómo es una sesión"
    dia_min: "Minutos"
    dia_que: "Qué pasa"
