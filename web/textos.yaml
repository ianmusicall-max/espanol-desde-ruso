# Los textos de la web, en los tres idiomas.
#
# Las LECCIONES no están aquí y no se traducen: son el curso, y están en ruso
# con el español como lengua meta. Lo que se traduce es la web que las rodea,
# para que alguien que no lee ruso entienda qué es esto.
#
# El ruso es el idioma por defecto y vive en la raíz; español e inglés cuelgan
# de /es/ y /en/. Si cambias un texto, se cambia solo donde está: el
# constructor no interpreta nada, copia lo que lee.

idiomas:
  - codigo: ru
    nombre: "Русский"
    carpeta: ""
    html: "ru"
  - codigo: es
    nombre: "Español"
    carpeta: "es"
    html: "es"
  - codigo: en
    nombre: "English"
    carpeta: "en"
    html: "en"

