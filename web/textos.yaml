en:
  menu: {inicio: "Home", curso: "Lessons", sobre: "About", contacto: "Contact"}
  titulo_sitio: "Spanish from Russian"
  portada:
    titulo: "Spanish from scratch"
    titulo2: "for Russian speakers"
    lema: "30 minutes a day: zero to A2 in a year"
    entrada: "A free course of 365 thirty-minute lessons, from the alphabet to level A2 and the DELE exam. No sign-up, no payment, in the browser. The lessons are written in Russian, the learner's language."
    marco: "The programme follows CEFR levels A1–A2 and prepares for the DELE A2, the official exam of the Instituto Cervantes."
    boton: "See the first lesson"
    boton2: "See the syllabus"
    ya_sabe: "Already know some Spanish?"
    progreso: "lessons published"
    progreso_nota: "that is over {n} {meses} of daily study — plenty to start with"
    meses: ["months", "months"]
    dif_titulo: "What makes it different"
    dif_texto: "An ordinary textbook explains the Spanish rule. This one also explains <strong>where the learner's own language betrays them</strong>. Every lesson has a section, «Contrast with Russian», that names the mistake before it happens:"
    dif_error: "You will want to say:"
    dif_bien: "Correct:"
    dif_nota: "Russian has no article at all. So the learner does not «forget» it: they cannot hear that anything is missing. For the first three months the article comes back in the answer key of every exercise."
    dif_ayuda: "And the other way round: where Russian <em>helps</em>, the course says so plainly. <em>Me gusta el café</em> is literally «мне нравится кофе», the same structure. Reflexives are the Russian <em>-ся</em>. The past tenses are taught on the aspect the learner already has."
    dia_titulo: "What a session looks like"
    dia_min: "Minutes"
    dia_que: "What happens"
    dia_filas:
      - ["0–3", "Warm-up: yesterday's flashcards"]
      - ["3–6", "Pronunciation or listening"]
      - ["6–16", "The new point: example, rule and contrast with Russian"]
      - ["16–26", "Three exercises with answer keys"]
      - ["26–29", "Output: the learner writes or records something"]
      - ["29–30", "Wrap-up and new flashcards"]
    dia_nota: "Thirty minutes exactly. Not 45, not «however long it takes»: a day that does not fit in half an hour is split into two days."
    ano_titulo: "What you get"
    ano_tarjetas:
      - ["After 2 weeks", "Reads any Spanish word aloud, greets people, introduces themselves, counts to twenty."]
      - ["After 3 months", "Talks about family, home and daily routine, orders food, buys clothes."]
      - ["After 6 months · A1", "Travels, goes to the doctor, gives advice. Would pass an A1 exam."]
      - ["After a year · A2", "Talks about past and future, gives opinions, writes emails. Ready for the <strong>DELE A2</strong>."]
    final_titulo: "How much is published"
    final_texto: "The syllabus for all 365 days is complete. Lessons go up as they are written and reviewed."
    final_boton: "Start"
  curso:
    titulo: "Lessons"
    subtitulo: "365 days, 52 weeks, 24 units"
    entrada: "Links open the lessons already written. For the rest, the topic of the day is shown: the syllabus covers the whole year."
    tema: "Unit"
    semana: "Week"
    objetivos: "Objectives"
    mapa: "The whole course"
    mapa_nota: "24 units in a year. Tap a unit to see its lessons."
    episodio: "Episode"
    listos: "ready"
    niveles: "level"
    semanas: "weeks"
  sobre:
    titulo: "About the course"
    quien: "Who writes it"
    porque: "Why «from Russian» and not just «Spanish»"
    porque_texto: "Spanish courses are written for everyone at once. But mistakes are not everyone's: they belong to a language. A Russian speaker drops the article not out of carelessness, but because that category does not exist in their language. They put the adjective first because that is how Russian works. They say «мне тридцать» and translate <em>soy treinta años</em>, because in Russian age takes the dative."
    porque_texto2: "The course is built around those twenty typical mistakes. They are listed in advance, worked through one by one, and they come back in the answer keys and in the distractors of the tests: the wrong option is always the one a Russian speaker would pick."
    como: "How to study"
    como_texto: "One lesson a day, in order, thirty minutes. No more: the course is designed for a year, and skipping a week does less harm than three lessons in one evening. Every lesson ends in an «output», something the learner writes or records. Without it the lesson does not count."
    cuanto: "What it costs"
    cuanto_texto: "Nothing. The whole course is open, with no sign-up. The site is supported by advertising."
    abierto: "Published"
  contacto:
    titulo: "Contact"
    texto: "Write about a mistake in a lesson, about something unclear, or about lessons with a teacher."
    error: "Found a mistake? That is the most useful message you can send: the course is written in order, and a typo in an answer key spoils the exercise for everyone."
    sin_correo: "No contact address has been published yet."
    autor: "About the author"
  privacidad:
    titulo: "Privacy policy"
    actualizado: "Updated"
    propio: "What the site itself collects"
    propio_texto: "Nothing. There is no sign-up, no forms, no comments, no accounts. We do not ask for or store your name, address or email."
    anuncios: "Advertising"
    anuncios_texto: "The site shows Google AdSense advertising. Google and its partners use cookies to serve ads based on your previous visits to this and other websites."
    anuncios_optar: "Personalised advertising can be switched off in Google's ad settings, and third-party vendors at aboutads.info."
    estadistica: "Analytics"
    estadistica_texto: "We count visits with Google Analytics to know which lessons get read. It is anonymous statistics: we cannot see who you are."
    sin_cookies: "Cookies"
    sin_cookies_texto: "Right now the site uses no advertising or analytics cookies and loads no third-party scripts. The only thing that may be stored in your browser is your own reading preferences."
    derechos: "Your rights"
    derechos_texto: "If you are in the European Union you have the right to access, correct and erase your data. Since the site stores no data about you, such requests go directly to Google."
    ninos: "Children"
