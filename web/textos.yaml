    semanas: "semanas"
  sobre:
    titulo: "El curso"
    quien: "Quién lo escribe"
    porque: "Por qué «desde el ruso» y no «español» a secas"
    porque_texto: "Los cursos de español se escriben para todos a la vez. Pero los errores no son de todos: son de cada lengua. Un rusohablante omite el artículo no por distracción, sino porque en su idioma esa categoría no existe. Antepone el adjetivo porque así funciona el ruso. Dice «мне тридцать» y traduce <em>soy treinta años</em>, porque en ruso la edad va en dativo."
    porque_texto2: "El curso está construido alrededor de esos veinte errores típicos. Están listados de antemano, se trabajan uno a uno y vuelven en las claves y en los distractores de las pruebas: la opción incorrecta es siempre la que diría un rusohablante."
    como: "Cómo se estudia"
    como_texto: "Una lección al día, en orden, treinta minutos. No más: el curso está pensado para un año, y saltarse una semana hace menos daño que tres lecciones seguidas una noche. Cada lección termina en una «salida», algo que el alumno escribe o graba. Sin eso la lección no cuenta."
    cuanto: "Cuánto cuesta"
    cuanto_texto: "Nada. El curso está abierto entero, sin registro. La web se sostiene con publicidad."
    abierto: "Publicadas"
    falta: "Qué hace falta"
    falta_texto: "No hay que comprar nada: el curso, el audio, los dibujos y las tarjetas son gratis y sin registro. Pero tres cosas se necesitan desde el primer día, y conviene saberlo antes de empezar."
    falta_lista:
      - "<strong>Un cuaderno y un bolígrafo.</strong> Más de la mitad de las lecciones piden escribir algo a mano. No es un capricho: la mano retiene la ortografía mejor que el teclado, y las tildes y la ñ en el móvil se teclean mal."
      - "<strong>Un móvil con grabadora.</strong> Una de cada cinco lecciones pide grabarse y escucharse. El propio acento no se oye desde dentro: es la única forma de notarlo. Sirve la grabadora que ya trae el teléfono."
      - "<strong>Tarjetas de vocabulario.</strong> Casi todas las lecciones empiezan con ellas. No hay que hacerlas: la baraja ya está hecha —3001 palabras con voz y dibujo— y se descarga en la página de las lecciones. De papel también valen."
    falta_no: "Lo que NO hace falta: un libro de texto —el curso se sostiene solo—, un diccionario —todas las palabras vienen traducidas en la propia lección— ni impresora. Con auriculares los sonidos españoles se oyen mejor, pero se puede sin ellos."
    dele: "Para qué sirve: el examen DELE A2"
    dele_texto: "El curso lleva al DELE A2, el Diploma de Español como Lengua Extranjera. Lo expide el Instituto Cervantes en nombre del Ministerio de Educación de España."
    dele_lista:
      - "<strong>No caduca.</strong> Se aprueba una vez y no hay que renovarlo ni revalidarlo."
      - "<strong>Tiene reconocimiento internacional:</strong> es un título oficial del Estado español, no el certificado de una academia."
      - "<strong>Hace falta para la nacionalidad española.</strong> Quien no tiene el español como lengua materna lo necesita al solicitar la nacionalidad por residencia. Los nacionales de veinte países hispanohablantes están exentos; los rusohablantes, precisamente, no."
      - "<strong>Acredita un nivel que se entiende:</strong> comprende el habla cotidiana sobre uno mismo, la familia, las compras, el trabajo y los desplazamientos, y se hace entender en situaciones sencillas."
    dele_examen: "El examen son cuatro pruebas: lectura (60 minutos), audición (40), escritura (45) y oral (12 minutos más 12 de preparación). Se puntúa en dos grupos y hay que sacar el 60 % en cada uno: lectura con escritura en uno, audición con oral en el otro. Por eso no basta la gramática, y las cuatro últimas semanas del curso son simulacros enteros."
    dele_aviso: "Las fechas, el precio y los centros cambian cada año, así que no están aquí: se consultan en examenes.cervantes.es. El curso prepara para el examen; no inscribe a nadie ni garantiza nada."
