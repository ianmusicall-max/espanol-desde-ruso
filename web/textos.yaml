es:
  menu: {inicio: "Inicio", curso: "Las lecciones", sobre: "El curso", contacto: "Contacto"}
  titulo_sitio: "Español desde el ruso"
  portada:
    titulo: "Español desde cero"
    titulo2: "para rusohablantes"
    lema: "30 minutos al día: en un año, de cero a A2"
    entrada: "Curso gratuito de 365 lecciones de 30 minutos, del alfabeto al nivel A2 y al examen DELE. Sin registro, sin pago, en el navegador. Las lecciones están escritas en ruso, que es la lengua del alumno."
    marco: "El programa sigue los niveles A1–A2 y prepara para el DELE A2, el examen oficial del Instituto Cervantes."
    boton: "Ver la primera lección"
    boton2: "Ver el programa"
    ya_sabe: "¿Ya sabe algo de español?"
    progreso: "lecciones publicadas"
    progreso_nota: "son más de {n} {meses} de estudio diario: hay de sobra para empezar"
    meses: ["meses", "meses"]
    dif_titulo: "Qué lo hace distinto"
    dif_texto: "Un manual corriente explica la regla española. Este explica además <strong>dónde le traiciona su propia lengua</strong> al alumno. Cada lección lleva un apartado, «Contraste con el ruso», que nombra el error antes de que ocurra:"
    dif_error: "Vas a querer decir:"
    dif_bien: "Correcto:"
    dif_nota: "El ruso no tiene artículo. Por eso el alumno no lo «olvida»: no percibe que falte algo. Los tres primeros meses del curso el artículo vuelve en la clave de cada ejercicio."
    dif_ayuda: "Y al revés: donde el ruso <em>ayuda</em>, el curso lo dice con todas las letras. <em>Me gusta el café</em> es literalmente «мне нравится кофе», la misma estructura. Los reflexivos son el <em>-ся</em> ruso. Los pasados se enseñan sobre el aspecto que el alumno ya tiene."
    dia_titulo: "Cómo es una sesión"
    dia_min: "Minutos"
    dia_que: "Qué pasa"
    dia_filas:
      - ["0–3", "Calentamiento: las tarjetas de ayer"]
      - ["3–6", "Fonética o comprensión oral"]
      - ["6–16", "Lo nuevo: ejemplo, regla y contraste con el ruso"]
      - ["16–26", "Tres ejercicios con sus claves"]
      - ["26–29", "Salida: el alumno escribe o graba algo"]
      - ["29–30", "Cierre y tarjetas nuevas"]
    dia_nota: "Treinta minutos exactos. Ni 45 ni «lo que salga»: el día que no cabe en media hora se parte en dos días."
    ano_titulo: "Qué se consigue"
    ano_tarjetas:
      - ["A las 2 semanas", "Lee en voz alta cualquier palabra española, saluda, se presenta y cuenta hasta veinte."]
      - ["A los 3 meses", "Habla de su familia, su casa y su día, pide en un bar y compra ropa."]
      - ["A los 6 meses · A1", "Viaja, va al médico, da consejos. Aprobaría un examen de nivel A1."]
      - ["Al año · A2", "Habla del pasado y del futuro, opina, escribe correos. Listo para el <strong>DELE A2</strong>."]
    final_titulo: "Cuánto hay publicado"
    final_texto: "El programa de los 365 días está completo. Las lecciones se publican a medida que se escriben y se revisan."
    final_boton: "Empezar"
  curso:
    titulo: "Las lecciones"
    subtitulo: "365 días, 52 semanas, 24 unidades"
    entrada: "Los enlaces abren las lecciones ya escritas. Del resto se muestra el tema del día: el programa está hecho para el año entero."
    tema: "Unidad"
    semana: "Semana"
    objetivos: "Objetivos"
    mapa: "El curso entero"
    mapa_nota: "24 unidades en un año. Pulse una unidad para ver sus lecciones."
    episodio: "Episodio"
    listos: "listas"
    niveles: "nivel"
    semanas: "semanas"
  sobre:
    titulo: "El curso"
    quien: "Quién lo escribe"
    porque: "Por qué «desde el ruso» y no «español» a secas"
    porque_texto: "Los cursos de español se escriben para todos a la vez. Pero los errores no son de todos: son de cada lengua. Un rusohablante omite el artículo no por distracción, sino porque en su idioma esa categoría no existe. Antepone el adjetivo porque así funciona el ruso. Dice «мне тридцать» y traduce <em>soy treinta años</em>, porque en ruso la edad va en dativo."
    porque_texto2: "El curso está construido alrededor de esos veinte errores típicos. Están listados de antemano, se trabajan uno a uno y vuelven en las claves y en los distractores de las pruebas: la opción incorrecta es siempre la que diría un rusohablante."
    como: "Cómo se estudia"
    como_texto: "Una lección al día, en orden, treinta minutos. No más: el curso está pensado para un año, y saltarse una semana hace menos daño que tres lecciones seguidas una noche. Cada lección termina en una «salida», algo que el alumno escribe o graba. Sin eso la lección no cuenta."
    cuanto: "Cuánto cuesta"
    cuanto_texto: "Nada. El curso está abierto entero, sin registro. La web se sostiene con publicidad."
    abierto: "Publicadas"
  contacto:
    titulo: "Contacto"
    texto: "Escriba por un error en una lección, por algo que no se entienda o por clases con profesor."
    error: "¿Ha encontrado un error? Es el mensaje más útil que se puede mandar: el curso se escribe en orden, y una errata en una clave estropea el ejercicio para todos."
    sin_correo: "Todavía no hay dirección de contacto publicada."
    autor: "Sobre el autor"
  privacidad:
    titulo: "Política de privacidad"
    actualizado: "Actualizada"
    propio: "Qué recoge la web"
    propio_texto: "Nada. No hay registro, ni formularios, ni comentarios, ni cuentas. No pedimos ni guardamos su nombre, su dirección ni su correo."
    anuncios: "Publicidad"
    anuncios_texto: "La web muestra publicidad de Google AdSense. Google y sus socios usan cookies para mostrar anuncios según sus visitas anteriores a esta y a otras webs."
    anuncios_optar: "La publicidad personalizada se desactiva en la configuración de anuncios de Google, y la de terceros en aboutads.info."
    estadistica: "Estadística"
    estadistica_texto: "Contamos las visitas con Google Analytics para saber qué lecciones se leen. Es estadística anónima: no sabemos quién es usted."
    sin_cookies: "Cookies"
    sin_cookies_texto: "Ahora mismo la web no usa cookies publicitarias ni analíticas y no carga scripts de terceros. Lo único que puede quedar guardado en el navegador son sus propias preferencias de lectura."
