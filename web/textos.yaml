    subtitulo: "365 días, 52 semanas, 24 unidades"
    entrada: "Las 365 lecciones de español desde cero: 24 temas, 52 semanas, del alfabeto al nivel A2 y al examen DELE. Gratis y sin registro."
    tema: "Unidad"
    semana: "Semana"
    objetivos: "Objetivos"
