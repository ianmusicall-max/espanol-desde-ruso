    # Los mensajes de aliento al terminar una lección. Son LISTAS y van
    # emparejadas por índice: `bravo[i]` es la misma frase que `bravo_con[i]`
    # con el nombre dentro, así que las dos tienen que medir lo mismo y hay una
    # prueba que lo exige. El nombre no siempre va al final —en ruso y en
    # español hay frases donde suena mejor delante—, y por eso son dos listas y
    # no una frase con una coma pegada.
    bravo:
      - "Отлично!"
      - "Так держать!"
      - "Хорошая работа!"
      - "Ещё один урок позади!"
      - "Вы молодец!"
      - "Готово!"
      - "Вот это темп!"
      - "Продолжайте так же!"
      - "Шаг за шагом — и получается!"
    bravo_con:
      - "Отлично, {nombre}!"
      - "Так держать, {nombre}!"
      - "Хорошая работа, {nombre}!"
      - "{nombre}, ещё один урок позади!"
      - "Вы молодец, {nombre}!"
      - "Готово, {nombre}!"
      - "Вот это темп, {nombre}!"
      - "Продолжайте так же, {nombre}!"
      - "Шаг за шагом, {nombre}, — и получается!"
    # La primera lección tiene su propio mensaje: es el momento en que más
    # gente se va, y un «Отлично!» de rotación no dice nada de lo que acaba
    # de pasar.
    # El recuadro de la portada no felicita: ahí el lector LLEGA, no acaba
    # de terminar nada. Es fijo a propósito; lo que varía es el mensaje de
    # la lección.
    vuelta: "С возвращением, {nombre}!"
    primera: "Первый урок пройден — самое трудное уже позади."
    primera_con: "{nombre}, первый урок пройден — самое трудное уже позади."
