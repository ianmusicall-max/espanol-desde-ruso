      - ["0–3", "Calentamiento: las tarjetas de ayer"]
      - ["3–6", "Fonética o comprensión oral"]
      - ["6–16", "Lo nuevo: ejemplo, regla y contraste con el ruso"]
      - ["16–26", "Tres ejercicios con sus claves"]
      - ["26–29", "Salida: el alumno escribe o graba algo"]
      - ["29–30", "Cierre y tarjetas nuevas"]
    dia_nota: "Treinta minutos exactos. Ni 45 ni «lo que salga»: el día que no cabe en media hora se parte en dos días."
