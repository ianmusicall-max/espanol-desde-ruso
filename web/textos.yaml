  sobre:
    titulo: "About the course"
    quien: "Who writes it"
    porque: "Why «from Russian» and not just «Spanish»"
    porque_texto: "Spanish courses are written for everyone at once. But mistakes are not everyone's: they belong to a language. A Russian speaker drops the article not out of carelessness, but because that category does not exist in their language. They put the adjective first because that is how Russian works. They say «мне тридцать» and translate <em>soy treinta años</em>, because in Russian age takes the dative."
    porque_texto2: "The course is built around those twenty typical mistakes. They are listed in advance, worked through one by one, and they come back in the answer keys and in the distractors of the tests: the wrong option is always the one a Russian speaker would pick."
    como: "How to study"
    como_texto: "One lesson a day, in order, thirty minutes. No more: the course is designed for a year, and skipping a week does less harm than three lessons in one evening. Every lesson ends in an «output», something the learner writes or records. Without it the lesson does not count."
    cuanto: "What it costs"
    cuanto_texto: "Nothing. The whole course is open, with no sign-up. The site is supported by advertising."
    abierto: "Published"
    falta: "What you need"
    falta_texto: "Nothing to buy: the course, the audio, the drawings and the flashcards are free and need no sign-up. But three things are needed from day one, and it is better to know beforehand."
    falta_lista:
      - "<strong>A notebook and a pen.</strong> More than half the lessons ask you to write something by hand. Not a whim: the hand remembers spelling better than a keyboard, and accents and ñ are awkward to type on a phone."
      - "<strong>A phone that records.</strong> One lesson in five asks you to record yourself and listen. You cannot hear your own accent from the inside — this is the only way to notice it. The recorder already on your phone will do."
      - "<strong>Vocabulary flashcards.</strong> Almost every lesson starts with them. You do not have to make them: the deck is ready — 3,001 words with audio and pictures — and downloads from the lessons page. Paper ones work too."
    falta_no: "What you do NOT need: a textbook — the course stands on its own; a dictionary — every word is translated inside the lesson; or a printer. Headphones make the Spanish sounds clearer, but you can do without."
    dele: "What it is for: the DELE A2 exam"
    dele_texto: "The course leads to the DELE A2, the Diploma of Spanish as a Foreign Language. It is issued by the Instituto Cervantes on behalf of Spain's Ministry of Education."
    dele_lista:
      - "<strong>It never expires.</strong> Pass once and there is nothing to renew or revalidate."
      - "<strong>It is recognised internationally:</strong> an official Spanish state qualification, not a language-school certificate."
      - "<strong>It is required for Spanish nationality.</strong> Anyone whose first language is not Spanish needs it when applying for nationality by residence. Nationals of twenty Spanish-speaking countries are exempt; Russian speakers are not."
      - "<strong>It certifies a level you can describe:</strong> you understand everyday speech about yourself, family, shopping, work and getting around, and you can make yourself understood in simple situations."
    dele_examen: "The exam has four papers: reading (60 minutes), listening (40), writing (45) and speaking (12 minutes plus 12 to prepare). It is marked in two groups and you need 60 % in each: reading with writing in one, listening with speaking in the other. Grammar alone is not enough, which is why the last four weeks of the course are full mock exams."
    dele_aviso: "Dates, price and centres change every year, so they are not here: check examenes.cervantes.es. The course prepares you for the exam; it does not enrol you and guarantees nothing."
