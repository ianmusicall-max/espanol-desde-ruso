# Configuración del sitio público (docs/).
#
# Todo lo que está vacío queda APAGADO: el sitio se construye y funciona igual,
# solo que sin anuncios, sin analítica y sin aviso de cookies. Eso es a
# propósito: así se puede publicar hoy, pedir el alta en AdSense cuando haya
# contenido suficiente, y encender la publicidad cambiando una línea de aquí
# sin tocar una sola línea de código.

# La URL pública, sin barra final. Hace falta para las etiquetas canónicas, el
# sitemap y las tarjetas de redes sociales. Con GitHub Pages:
#   https://ianmusicall-max.github.io/espanol-desde-ruso
# Con dominio propio, el dominio.
dominio: "https://espanoldesderuso.com"

# Lo que se ve en el navegador y en los buscadores.
titulo: "Испанский с нуля для русскоговорящих"
lema: "30 минут в день — за год от нуля до A2"
descripcion: >-
  Бесплатный курс испанского языка для русскоговорящих с нуля: 365 уроков по
  30 минут, от алфавита до уровня A2 и экзамена DELE. Каждый урок объясняет,
  где русский язык подсказывает, а где подводит.
idioma: "ru"

# Autor del curso. Sale en la página «О курсе» y en los datos estructurados.
autor:
  nombre: ""
  descripcion: >-
    Преподаватель с магистратурой по языкам. Испанский — родной, владеет тремя
    языками. Курс написан специально для русскоговорящих.
  # Correo de contacto. Se publica en la web. Es una cuenta aparte, hecha
  # para el curso, para que el spam de publicarlo no caiga en la personal.
  email: "espanoldesderuso@gmail.com"

# Google AdSense. Vacío = sin anuncios y sin aviso de cookies.
# El alta se pide en adsense.google.com; dan el identificador ca-pub-… y
# después los identificadores de cada bloque.
adsense:
  cliente: "ca-pub-6339208855562328"   # la cuenta estándar del profesor
  bloques:
    cabecera: ""       # el bloque de arriba, debajo del título
    dentro: ""         # entre la teoría y los ejercicios
    pie: ""            # al final del texto

# Google Analytics. Vacío = sin analítica y sin cookies.
analitica:
  google: ""           # G-XXXXXXXXXX

# Los perfiles del curso en redes. Vacío = no sale el enlace, en vez de un
# botón que lleva a una cuenta que no existe.
#
# Son ENLACES NORMALES y nunca los widgets oficiales: el botón «Compartir» de
# Facebook carga el SDK de Meta, que rastrea al lector. La política de
# privacidad de este sitio dice que sin AdSense no se carga nada de terceros, y
# un widget la volvería mentira. Un enlace hace lo mismo y no carga nada.
redes:
  telegram: ""      # https://t.me/…
  instagram: ""     # https://instagram.com/…
  youtube: ""       # https://youtube.com/@…
  facebook: ""      # https://facebook.com/…
